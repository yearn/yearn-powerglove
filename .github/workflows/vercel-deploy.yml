name: Deploy to Vercel

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write

cache-mode: none

jobs:
  yearn-powerglove:
    uses: yearn/yearn-gha/.github/workflows/vercel-deploy.yml@a4164f56071429c0edcd35ba66c84de6a6fd5c8b
    with:
      project: yearn-powerglove
      identity-id: ${{ github.event_name == 'pull_request' && vars.DOPPLER_PREVIEW_IDENTITY_ID || vars.DOPPLER_PRODUCTION_IDENTITY_ID }}
